# JVM heap for the Gradle daemon. Android builds are memory-hungry.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Build speed: reuse outputs, run independent tasks in parallel.
org.gradle.caching=true
org.gradle.parallel=true

# Use the AndroidX libraries (modern) rather than the ancient support library.
android.useAndroidX=true

# Each module gets its own R class instead of one giant merged one. Faster builds.
android.nonTransitiveRClass=true

kotlin.code.style=official

# KSP (Room's code generator) still registers its generated sources via the
# `kotlin.sourceSets` DSL, which AGP 9's built-in Kotlin rejects by default.
# This flag restores the old permissive behaviour. Remove it once KSP ships a
# release that uses `android.sourceSets`.
android.disallowKotlinSourceSets=false
