# ============================================================================
#  Version Catalog  —  the Gradle equivalent of your package.json "dependencies"
# ----------------------------------------------------------------------------
#  In Angular/React you list versions in package.json. Gradle's modern answer is
#  this TOML file: every version lives in one place, and build files refer to
#  entries by alias (e.g. libs.retrofit). The alias dots become dashes here:
#  `androidx-core-ktx` below is used as `libs.androidx.core.ktx` in Kotlin.
# ============================================================================
[versions]
agp = "9.5.1"                      # Android Gradle Plugin: turns Kotlin into an APK
kotlin = "2.4.21"                  # overrides AGP 9's bundled KGP 2.2.10 (see root build file)
ksp = "2.3.13"                     # KSP2 uses its own version line, independent of Kotlin
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
composeBom = "2026.09.00"          # BOM = one version that pins all Compose libs
room = "2.8.5"
retrofit = "3.0.0"
serializationJson = "1.13.0"
coroutines = "1.11.0"
coil = "3.6.3"
junit = "4.13.2"
turbine = "1.2.1"

[libraries]
# --- Android platform basics -------------------------------------------------
androidx-core-ktx                   = { group = "androidx.core",      name = "core-ktx",         version.ref = "coreKtx" }
androidx-activity-compose           = { group = "androidx.activity",  name = "activity-compose", version.ref = "activityCompose" }

# --- Lifecycle: ViewModel + state collection that respects the screen's life --
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }

# --- Navigation: like react-router / Angular Router --------------------------
androidx-navigation-compose         = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# --- Compose UI (versions come from the BOM, so no version.ref here) ---------
androidx-compose-bom                = { group = "androidx.compose",    name = "compose-bom",      version.ref = "composeBom" }
androidx-compose-ui                 = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics        = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling         = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3          = { group = "androidx.compose.material3", name = "material3" }
# Icons are a frozen artifact (pinned at 1.7.8 by the BOM) but still managed by it.
androidx-compose-material-icons     = { group = "androidx.compose.material", name = "material-icons-core" }

# --- Room: local SQLite database (iOS counterpart: SwiftData) ----------------
androidx-room-runtime               = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
androidx-room-ktx                   = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
androidx-room-compiler              = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- Networking: Retrofit + kotlinx.serialization ---------------------------
retrofit                            = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization      = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json          = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

# --- Coil: async image loading (iOS counterpart: AsyncImage) ----------------
coil-compose                        = { group = "io.coil-kt.coil3", name = "coil-compose",       version.ref = "coil" }
coil-network-okhttp                 = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# --- Testing ----------------------------------------------------------------
junit                               = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
turbine                             = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
android-application  = { id = "com.android.application",                 version.ref = "agp" }
# NOTE: there is deliberately NO kotlin-android plugin here. As of AGP 9.0,
# Kotlin support is built into the Android plugin, and applying
# `org.jetbrains.kotlin.android` alongside it is an error. AGP brings its own
# Kotlin Gradle Plugin (2.2.10), which is why `kotlin` above is pinned to match:
# the compose and serialization plugins must agree with the compiler in use.
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",     version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                 version.ref = "ksp" }
